[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-agent"
version = "0.2.0"
description = "Runnable hybrid RAG reference implementation with evaluation, grounding checks, and bounded agent orchestration."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "numpy>=1.24"]
rerank = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115,<0.130", "uvicorn>=0.30,<1", "pydantic>=2.7,<3"]
llm = ["httpx>=0.27,<1"]
dev = ["pytest>=8.0,<10", "ruff>=0.6", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
