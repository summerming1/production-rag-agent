[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "production-rag-agent"
version = "0.1.0"
description = "Runnable hybrid RAG reference implementation with evaluation, citations, and bounded agent orchestration."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dense = ["sentence-transformers>=3.0", "numpy>=1.24"]
rerank = ["sentence-transformers>=3.0"]
api = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7"]
llm = ["httpx>=0.27"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
